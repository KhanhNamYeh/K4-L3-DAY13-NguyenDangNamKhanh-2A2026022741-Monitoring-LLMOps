alerts:
  - name: HighLatencyP95
    severity: P2
    condition: 'percentile(response_sent.latency_ms, 95) over 5m > 3000'
    duration: 5m
    type: symptom-based
    slo: fast_successful_requests
    channel: slack
    slack_channel: '#day13-llmops-alerts'
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: P1
    condition: 'count(request_failed) / count(request_received) * 100 over 5m > 2'
    duration: 5m
    type: symptom-based
    slo: fast_successful_requests
    channel: slack
    slack_channel: '#day13-llmops-alerts'
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-2
  - name: CostBurnRateHigh
    severity: P3
    condition: 'sum(response_sent.cost_usd) over 1h * 24 > 2.5'
    duration: 15m
    type: symptom-based
    slo: guardrails.daily_cost_usd_max
    channel: slack
    slack_channel: '#day13-llmops-alerts'
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-3
